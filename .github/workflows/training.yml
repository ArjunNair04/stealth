name: Torch reference
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    name: Torch ${{ matrix.torch }} CPU reference
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.2.2+cpu", "2.13.0+cpu"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install explicit CPU reference and native build dependencies
        run: |
          python -m pip install -r requirements-training-common.txt scikit-build-core==0.11.6 pybind11==3.0.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==${{ matrix.torch }}'
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
      - name: Build native worker for synthetic sizing integration (no speed gate)
        run: |
          cmake --preset release -DSTEALTH_BUILD_BENCHMARKS=ON
          cmake --build --preset release --target stealth_cli stealth_runtime_bench
      - name: Component, gradient, checkpoint and end-to-end parity tests
        run: python -m unittest discover -s tests/training -v
