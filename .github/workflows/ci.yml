name: Native C++

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cxx: g++
            python: "3.10"
          - name: Linux Clang
            os: ubuntu-24.04
            cxx: clang++
            python: "3.12"
          - name: macOS ARM
            os: macos-14
            cxx: clang++
            python: "3.12"
          - name: macOS Intel
            os: macos-15-intel
            cxx: clang++
            python: "3.12"
          - name: Windows MSVC
            os: windows-2022
            cxx: cl
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialise MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test public benchmark preparation (offline, standard library)
        run: python -m unittest discover -s tests -p test_public_benchmark.py -v
      - name: Verify independent numeric fixture
        if: matrix.name == 'Linux GCC'
        run: python3 tools/generate_numeric_fixture.py --check
      - name: Verify independent attention fixture
        if: matrix.name == 'Linux GCC'
        run: python3 tools/generate_attention_fixture.py --check
      - name: Verify independent full-model fixture
        if: matrix.name == 'Linux GCC'
        run: python3 tools/generate_forecast_fixture.py --check
      - name: Configure debug
        run: cmake --preset dev -DSTEALTH_WARNINGS_AS_ERRORS=ON
      - name: Build debug
        run: cmake --build --preset dev
      - name: Test debug and package relocation
        run: ctest --preset dev
      - name: Configure release
        run: cmake --preset release -DSTEALTH_WARNINGS_AS_ERRORS=ON -DSTEALTH_BUILD_BENCHMARKS=ON
      - name: Build release
        run: cmake --build --preset release
      - name: Test release and package relocation
        run: ctest --preset release
      - name: Benchmark smoke (no latency gate)
        run: ./build/release/stealth_bench --samples 100
      - name: Sanitizer configure
        if: matrix.name == 'Linux Clang'
        run: cmake --preset sanitize
      - name: Sanitizer build
        if: matrix.name == 'Linux Clang'
        run: cmake --build --preset sanitize
      - name: Sanitizer test
        if: matrix.name == 'Linux Clang'
        run: ctest --preset sanitize
      - name: Install declared Python build dependencies
        run: python -m pip install -r requirements-python-dev.txt
      - name: Download the declared runtime wheel
        run: python -m pip download --only-binary=:all: --no-deps --dest local/python-wheelhouse numpy==2.2.6
      - name: Build and verify isolated Python package from source distribution
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path("local/python-wheelhouse").glob("numpy-*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "tools/check_python_package.py", "--output", "local/python-package-ci", "--numpy-wheel", str(wheels[0])], check=True)
      - name: Show package diagnostics on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for path in Path("local/python-package-ci").glob("*.log"):
              print(path.name)
              print(path.read_text(errors="replace")[-12000:])
