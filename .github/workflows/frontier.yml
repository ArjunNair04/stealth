name: Current CPU adapter admission
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    name: Linux Torch Inductor and ONNX CPU correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STEALTH_RUN_FRONTIER: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TORCHINDUCTOR_COMPILE_THREADS: "1"
      TORCHINDUCTOR_CACHE_DIR: ${{ github.workspace }}/local/inductor-ci-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install declared optional CPU compiler and exporter dependencies
        run: |
          python -m pip install -r requirements-frontier.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0+cpu'
          python -m pip install --no-build-isolation --no-deps .
          python -m pip check
          python -m pip freeze --all
      - name: Actual compiled and ONNX parity at fixture and deployed shapes
        run: python -m unittest discover -s tests/training -p test_runtime_adapters.py -v
